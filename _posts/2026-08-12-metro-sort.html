  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="title" content="Metrordle 🚇">
    <meta name="description" content="Ordena 5 estaciones de una línea del Metro de la Ciudad de México en el orden correcto. Tienes 5 intentos.">

    <title>Metrordle 🚇 - eduardogarcia.xyz</title>

    <style type="text/css">
      /* Palette inspired by the official STC Metro CDMX line colours, applied per-line via --line-color */
      :root {
        --bg: #0b0f14;
        --panel: #141a22;
        --panel-border: #232c38;
        --fg: #e7ecf2;
        --fg-muted: #93a1b3;
        --line-color: #0057a8;
        --line-color-fg: #ffffff;
        --correct: #29a366;
        --incorrect: #d8483f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg);
        color: var(--fg);
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        min-height: 100vh;
        min-height: 100dvh;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0 auto;
        max-width: 32rem;
        padding: 1rem 1rem 2rem;
      }

      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }

      .top-bar a {
        color: var(--fg-muted);
        font-size: .85rem;
        text-decoration: none;
      }

      h1 {
        font-size: clamp(1.4rem, 5vw, 1.75rem);
        margin: .5rem 0 .25rem;
      }

      .subtitle {
        color: var(--fg-muted);
        font-size: .95rem;
        margin: 0 0 .85rem;
      }

      .line-badge {
        align-items: center;
        background-color: var(--line-color);
        border-radius: 999px;
        color: var(--line-color-fg);
        display: inline-flex;
        font-weight: bold;
        gap: .5rem;
        padding: .4rem 1rem;
      }

      .line-badge__circle {
        align-items: center;
        background-color: var(--line-color-fg);
        border-radius: 999px;
        color: var(--line-color);
        display: flex;
        font-size: .9rem;
        font-weight: 900;
        height: 1.5rem;
        justify-content: center;
        width: 1.5rem;
      }

      .hint {
        background-color: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: .75rem;
        font-size: .95rem;
        line-height: 1.4;
        margin: .75rem 0;
        padding: .65rem .85rem;
        width: 100%;
      }

      .hint strong {
        color: var(--line-color);
      }

      .status {
        color: var(--fg-muted);
        font-size: .85rem;
        margin: 0 0 .4rem;
        min-height: 1.2em;
        text-align: center;
      }

      .status__badges {
        display: inline-flex;
        flex-wrap: wrap;
        gap: .3rem;
        margin-left: .4rem;
        vertical-align: middle;
      }

      .status__badge {
        border-radius: .3rem;
        color: #111418;
        display: inline-block;
        font-size: .72rem;
        font-weight: bold;
        padding: .12rem .4rem;
      }

      #status[data-tone="win"] {
        color: var(--correct);
        font-weight: bold;
      }

      #status[data-tone="lose"] {
        color: var(--incorrect);
        font-weight: bold;
      }

      .station-list {
        list-style: none;
        margin: 0;
        padding: 0;
        width: 100%;
      }

      .station {
        align-items: center;
        background-color: var(--panel);
        border: 2px solid var(--panel-border);
        border-radius: .6rem;
        display: flex;
        gap: .6rem;
        margin-bottom: .4rem;
        padding: .4rem .6rem;
        transition: border-color .2s ease, background-color .2s ease;
      }

      .station--correct {
        border-color: var(--correct);
      }

      .station--incorrect {
        border-color: var(--incorrect);
      }

      .station__rank {
        align-items: center;
        background-color: var(--line-color);
        border-radius: 999px;
        color: var(--line-color-fg);
        display: flex;
        flex: 0 0 auto;
        font-weight: bold;
        height: 1.6rem;
        justify-content: center;
        width: 1.6rem;
      }

      .station__name {
        flex: 1 1 auto;
        font-size: 1rem;
        line-height: 1.25;
      }

      .station__mark {
        flex: 0 0 auto;
        font-size: 1.15rem;
        line-height: 1;
      }

      .station__buttons {
        display: flex;
        flex: 0 0 auto;
        flex-direction: row;
        gap: .3rem;
      }

      .btn-move {
        background-color: var(--panel-border);
        border: none;
        border-radius: .4rem;
        color: var(--fg);
        cursor: pointer;
        font-size: 1rem;
        height: 2.1rem;
        line-height: 1;
        width: 2.4rem;
      }

      .btn-move:active {
        background-color: var(--line-color);
      }

      .btn-move:disabled {
        cursor: not-allowed;
        opacity: .3;
      }

      .btn-primary {
        background-color: var(--line-color);
        border: none;
        border-radius: .6rem;
        color: var(--line-color-fg);
        cursor: pointer;
        font-size: 1.05rem;
        font-weight: bold;
        margin-top: .5rem;
        padding: .9rem 1.5rem;
        width: 100%;
      }

      .btn-primary:disabled {
        cursor: not-allowed;
        opacity: .35;
      }

      .btn-secondary {
        background-color: transparent;
        border: 1px solid var(--panel-border);
        border-radius: .6rem;
        color: var(--fg);
        cursor: pointer;
        font-size: 1rem;
        margin-top: .75rem;
        padding: .8rem 1.5rem;
        width: 100%;
      }

      .result {
        margin-top: 1.5rem;
        width: 100%;
      }

      .result[hidden] {
        display: none;
      }

      .result h2 {
        font-size: 1.3rem;
        margin: 0 0 1rem;
      }

      .reveal h3 {
        color: var(--fg-muted);
        font-size: .8rem;
        letter-spacing: .05em;
        margin: 0 0 .5rem;
        text-transform: uppercase;
      }

      .reveal ol {
        margin: 0 0 1.25rem;
        padding-left: 1.25rem;
      }

      .reveal li {
        font-size: .9rem;
        line-height: 1.6;
      }

      .guess-grid {
        display: flex;
        flex-direction: column;
        gap: .4rem;
        margin-bottom: 1.25rem;
      }

      .guess-grid__row {
        align-items: center;
        display: flex;
        gap: .6rem;
      }

      .guess-grid__label {
        color: var(--fg-muted);
        flex: 0 0 auto;
        font-size: .8rem;
        width: 4.2rem;
      }

      .guess-grid__squares {
        display: flex;
        gap: .3rem;
        font-size: 1.3rem;
        line-height: 1;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="top-bar">
        <a href="/games">← Minigames</a>
      </div>

      <h1>Metrordle 🚇</h1>
      <p class="subtitle">Acomoda las 5 estaciones en el orden correcto de la línea. Tienes 5 intentos.</p>

      <div id="line-badge" class="line-badge">
        <span id="line-badge-circle" class="line-badge__circle"></span>
        <span id="line-badge-name"></span>
      </div>

      <p id="hint" class="hint"></p>

      <p id="status" class="status"></p>

      <ol id="station-list" class="station-list"></ol>

      <button id="check-btn" type="button" class="btn-primary">Verificar orden</button>

      <div id="result" class="result" hidden>
        <h2 id="result-heading"></h2>

        <div class="reveal">
          <h3>Orden correcto</h3>
          <ol id="reveal-correct-order"></ol>
        </div>

        <div id="guess-grid" class="guess-grid"></div>

        <button id="share-btn" type="button" class="btn-secondary">Compartir</button>
      </div>
    </main>

    <script>
      (function () {
        'use strict';

        var TOTAL_ATTEMPTS = 5;
        var STATIONS_PER_PUZZLE = 5;

        // Station order taken from the official STC Metro CDMX line diagrams,
        // listed from one terminus to the other.
        var LINES = [
          {
            id: '1',
            name: 'Línea 1',
            color: '#ec2a7b',
            textColor: '#ffffff',
            stations: ['Observatorio', 'Tacubaya', 'Juanacatlán', 'Chapultepec', 'Sevilla', 'Insurgentes', 'Cuauhtémoc', 'Balderas', 'Salto del Agua', 'Isabel la Católica', 'Pino Suárez', 'Merced', 'Candelaria', 'San Lázaro', 'Moctezuma', 'Balbuena', 'Boulevard Puerto Aéreo', 'Gómez Farías', 'Zaragoza', 'Pantitlán'],
          },
          {

            stations: ['Cuatro Caminos', 'Panteones', 'Tacuba', 'Cuitláhuac', 'Popotla', 'Colegio Militar', 'Normal', 'San Cosme', 'Revolución', 'Hidalgo', 'Bellas Artes', 'Allende', 'Zócalo', 'Pino Suárez', 'San Antonio Abad', 'Chabacano', 'Viaducto', 'Xola', 'Villa de Cortés', 'Nativitas', 'Portales', 'Ermita', 'General Anaya', 'Tasqueña'],
          },
          {

            stations: ['Indios Verdes', 'Deportivo 18 de Marzo', 'Potrero', 'La Raza', 'Tlatelolco', 'Guerrero', 'Hidalgo', 'Juárez', 'Balderas', 'Niños Héroes', 'Hospital General', 'Centro Médico', 'Etiopía', 'Eugenia', 'División del Norte', 'Zapata', 'Coyoacán', 'Viveros', 'Miguel Ángel de Quevedo', 'Copilco', 'Universidad'],
          },
          {

            color: '#00a99d',
            textColor: '#ffffff',
            stations: ['Martín Carrera', 'Talismán', 'Bondojito', 'Consulado', 'Canal del Norte', 'Morelos', 'Candelaria', 'Fray Servando', 'Jamaica', 'Santa Anita'],
          },
          {
            id: '5',

            color: '#ffcd00',
            textColor: '#1a1a1a',
            stations: ['Politécnico', 'Instituto del Petróleo', 'Autobuses del Norte', 'La Raza', 'Misterios', 'Valle Gómez', 'Consulado', 'Eduardo Molina', 'Aragón', 'Oceanía', 'Terminal Aérea', 'Hangares', 'Pantitlán'],
          },
          {
            id: '6',
            name: 'Línea 6',
            color: '#e2231a',
            textColor: '#ffffff',
            stations: ['El Rosario', 'Tezozómoc', 'UAM Azcapotzalco', 'Ferrería', 'Norte 45', 'Vallejo', 'Instituto del Petróleo', 'Lindavista', 'Deportivo 18 de Marzo', 'La Villa / Basílica', 'Martín Carrera'],
          },
          {
            id: '7',
            name: 'Línea 7',
            color: '#f68b1f',
            textColor: '#1a1a1a',
            stations: ['El Rosario', 'Aquiles Serdán', 'Camarones', 'Refinería', 'Tacuba', 'San Joaquín', 'Polanco', 'Auditorio', 'Constituyentes', 'Tacubaya', 'San Pedro de los Pinos', 'San Antonio', 'Mixcoac', 'Barranca del Muerto'],
          },
          {
            id: '8',
            name: 'Línea 8',
            color: '#0e8a4b',
            textColor: '#ffffff',
            stations: ['Garibaldi/Lagunilla', 'Bellas Artes', 'San Juan de Letrán', 'Salto del Agua', 'Doctores', 'Obrera', 'Chabacano', 'La Viga', 'Santa Anita', 'Coyuya', 'Iztacalco', 'Apatlaco', 'Aculco', 'Escuadrón 201', 'Atlalilco', 'Iztapalapa', 'Cerro de la Estrella', 'UAM-I', 'Constitución de 1917'],
          },
          {
            id: '9',
            name: 'Línea 9',
            color: '#6d4c33',
            textColor: '#ffffff',
            stations: ['Tacubaya', 'Patriotismo', 'Chilpancingo', 'Centro Médico', 'Lázaro Cárdenas', 'Chabacano', 'Jamaica', 'Mixiuhca', 'Velódromo', 'Ciudad Deportiva', 'Puebla', 'Pantitlán'],
          },
          {
            id: 'A',
            name: 'Línea A',
            color: '#8e2c8f',
            textColor: '#ffffff',
            stations: ['Pantitlán', 'Agrícola Oriental', 'Canal de San Juan', 'Tepalcates', 'Guelatao', 'Peñón Viejo', 'Acatitla', 'Santa Marta', 'Los Reyes', 'La Paz'],
          },
          {
            id: '12',
            name: 'Línea 12',
            color: '#a67c00',
            textColor: '#ffffff',
            stations: ['Mixcoac', 'Insurgentes Sur', 'Hospital 20 de Noviembre', 'Zapata', 'Parque de los Venados', 'Eje Central', 'Ermita', 'Mexicaltzingo', 'Atlalilco', 'Culhuacán', 'San Andrés Tomatlán', 'Lomas Estrella', 'Calle 11', 'Periférico Oriente', 'Tezonco', 'Olivos', 'Nopalera', 'Zapotitlán', 'Tlaltenco', 'Tláhuac'],
          },
          {
            id: 'B',
            name: 'Línea B',
            color: '#6b8570',
            textColor: '#ffffff',
            stations: ['Buenavista', 'Guerrero', 'Garibaldi/Lagunilla', 'Lagunilla', 'Tepito', 'Morelos', 'San Lázaro', 'Ricardo Flores Magón', 'Romero Rubio', 'Oceanía', 'Deportivo Oceanía', 'Bosque de Aragón', 'Villa de Aragón', 'Nezahualcóyotl', 'Impulsora', 'Río de los Remedios', 'Múzquiz', 'Ecatepec', 'Olímpica', 'Plaza Aragón', 'Ciudad Azteca'],
          },
        ];

        var state = null;
        var els = {};

        function $(id) {
          return document.getElementById(id);
        }

        function shuffle(array) {
          var copy = array.slice();

          for (var i = copy.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = copy[i];
            copy[i] = copy[j];
            copy[j] = tmp;
          }

          return copy;
        }

        function arraysEqual(a, b) {
          if (a.length !== b.length) {
            return false;
          }

          for (var i = 0; i < a.length; i++) {
            if (a[i] !== b[i]) {
              return false;
            }
          }

          return true;
        }

        // Deterministic daily puzzle: every visitor on the same calendar day
        // gets the same line and the same 5 stations, derived from a seeded
        // PRNG (mulberry32) keyed by that day's date string.
        var START_DATE_KEY = '2026-08-13'; // Game #1

        function hashStringToInt(str) {
          var hash = 0x811c9dc5;

          for (var i = 0; i < str.length; i++) {
            hash ^= str.charCodeAt(i);
            hash = Math.imul(hash, 0x01000193);
          }

          return hash >>> 0;
        }

        function createSeededRandom(seedString) {
          var seed = hashStringToInt(seedString);

          return function () {
            seed |= 0;
            seed = (seed + 0x6D2B79F5) | 0;

            var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function pad2(n) {
          return n < 10 ? '0' + n : String(n);
        }

        function getDateKey(date) {
          return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
        }

        function getGameNumberForDateKey(dateKey) {
          var start = new Date(START_DATE_KEY + 'T00:00:00');
          var target = new Date(dateKey + 'T00:00:00');
          var msPerDay = 24 * 60 * 60 * 1000;

          return Math.round((target.getTime() - start.getTime()) / msPerDay) + 1;
        }

        function getPuzzleForDateKey(dateKey) {
          var rand = createSeededRandom('metrordle-' + dateKey);
          var line = LINES[Math.floor(rand() * LINES.length)];
          var maxStart = line.stations.length - STATIONS_PER_PUZZLE;
          var start = Math.floor(rand() * (maxStart + 1));

          return {
            line: line,
            correctOrder: line.stations.slice(start, start + STATIONS_PER_PUZZLE),
          };
        }

        function storageKeyFor(dateKey) {
          return 'metrordle:' + dateKey;
        }

        function loadSavedState(dateKey) {
          try {
            var raw = localStorage.getItem(storageKeyFor(dateKey));

            if (!raw) {
              return null;
            }

            var parsed = JSON.parse(raw);

            if (!parsed || !Array.isArray(parsed.history)) {
              return null;
            }

            return parsed;
          } catch (e) {
            return null;
          }
        }

        function persistState() {
          try {
            localStorage.setItem(storageKeyFor(state.dateKey), JSON.stringify({
              history: state.history,
              gameOver: state.gameOver,
              won: state.won,
            }));
          } catch (e) {
            // localStorage unavailable (private mode, quota, etc.) - the
            // game stays playable for this session, it just won't persist.
          }
        }

        function initGame() {
          var dateKey = getDateKey(new Date());
          var gameNumber = getGameNumberForDateKey(dateKey);
          var puzzle = getPuzzleForDateKey(dateKey);
          var saved = loadSavedState(dateKey);
          var history = saved ? saved.history : [];
          var gameOver = saved ? !!saved.gameOver : false;

          var currentOrder;

          if (gameOver && history.length > 0) {
            // Show the actual final guess, not a fresh shuffle, so the
            // result marks reflect what was really submitted.
            currentOrder = history[history.length - 1].guess.slice();
          } else {
            do {
              currentOrder = shuffle(puzzle.correctOrder);
            } while (arraysEqual(currentOrder, puzzle.correctOrder));
          }

          state = {
            dateKey: dateKey,
            gameNumber: gameNumber,
            line: puzzle.line,
            correctOrder: puzzle.correctOrder,
            currentOrder: currentOrder,
            attemptsRemaining: TOTAL_ATTEMPTS - history.length,
            history: history,
            gameOver: gameOver,
            won: saved ? !!saved.won : false,
          };

          document.documentElement.style.setProperty('--line-color', puzzle.line.color);
          document.documentElement.style.setProperty('--line-color-fg', puzzle.line.textColor);

          render();
        }

        function moveStation(index, direction) {
          if (state.gameOver) {
            return;
          }

          var target = index + direction;

          if (target < 0 || target >= state.currentOrder.length) {
            return;
          }

          var tmp = state.currentOrder[index];
          state.currentOrder[index] = state.currentOrder[target];
          state.currentOrder[target] = tmp;

          render();
        }

        function checkOrder() {
          if (state.gameOver) {
            return;
          }

          var correctCount = 0;

          for (var i = 0; i < state.currentOrder.length; i++) {
            if (state.currentOrder[i] === state.correctOrder[i]) {
              correctCount++;
            }
          }

          state.attemptsRemaining--;
          state.history.push({
            guess: state.currentOrder.slice(),
            correctCount: correctCount,
          });

          if (correctCount === STATIONS_PER_PUZZLE) {
            state.gameOver = true;
            state.won = true;
          } else if (state.attemptsRemaining === 0) {
            state.gameOver = true;
            state.won = false;
          }

          persistState();
          render();
        }

        function render() {
          renderBadge();
          renderHint();
          renderStatus();
          renderStationList();
          renderResult();

          els.checkBtn.disabled = state.gameOver;
        }

        function renderBadge() {
          els.lineBadgeCircle.textContent = state.line.id;
          els.lineBadgeName.textContent = state.line.name;
        }

        function renderHint() {
          var first = state.line.stations[0];
          var last = state.line.stations[state.line.stations.length - 1];

          els.hint.innerHTML = 'Ordena estas estaciones en el sentido <strong>' + first + '</strong> → <strong>' + last + '</strong>.';
        }

        function scaleColor(ratio) {
          var hue = Math.round(ratio * 120);
          return 'hsl(' + hue + ', 72%, 48%)';
        }

        function appendAttemptBadges(parent) {
          if (state.history.length === 0) {
            return;
          }

          var badges = document.createElement('span');
          badges.className = 'status__badges';

          state.history.forEach(function (attempt, i) {
            var badge = document.createElement('span');
            badge.className = 'status__badge';
            badge.textContent = attempt.correctCount + '/' + STATIONS_PER_PUZZLE;
            badge.style.backgroundColor = scaleColor(attempt.correctCount / STATIONS_PER_PUZZLE);
            badge.setAttribute('title', 'Intento ' + (i + 1));
            badges.appendChild(badge);
          });

          parent.appendChild(badges);
        }

        function renderStatus() {
          els.status.removeAttribute('data-tone');
          els.status.innerHTML = '';

          if (state.gameOver) {
            if (state.won) {
              els.status.textContent = '¡Correcto! Resolviste el orden en ' + state.history.length + (state.history.length === 1 ? ' intento.' : ' intentos.') + ' 🎉';
              els.status.setAttribute('data-tone', 'win');
            } else {
              els.status.appendChild(document.createTextNode('Se acabaron tus intentos.'));
              appendAttemptBadges(els.status);
              els.status.setAttribute('data-tone', 'lose');
            }

            return;
          }

          var plural = state.attemptsRemaining === 1 ? 'intento' : 'intentos';
          els.status.appendChild(document.createTextNode('Te quedan ' + state.attemptsRemaining + ' ' + plural + '.'));
          appendAttemptBadges(els.status);
        }

        function renderStationList() {
          els.stationList.innerHTML = '';

          state.currentOrder.forEach(function (name, index) {
            var li = document.createElement('li');
            li.className = 'station';

            if (state.gameOver) {
              var isCorrect = name === state.correctOrder[index];
              li.className += isCorrect ? ' station--correct' : ' station--incorrect';
            }

            var rank = document.createElement('span');
            rank.className = 'station__rank';
            rank.textContent = String(index + 1);

            var nameEl = document.createElement('span');
            nameEl.className = 'station__name';
            nameEl.textContent = name;

            li.appendChild(rank);
            li.appendChild(nameEl);

            if (state.gameOver) {
              var mark = document.createElement('span');
              mark.className = 'station__mark';
              mark.textContent = name === state.correctOrder[index] ? '🟩' : '🟥';
              li.appendChild(mark);
            } else {
              var buttons = document.createElement('span');
              buttons.className = 'station__buttons';

              var upBtn = document.createElement('button');
              upBtn.type = 'button';
              upBtn.className = 'btn-move';
              upBtn.textContent = '▲';
              upBtn.setAttribute('aria-label', 'Subir ' + name);
              upBtn.disabled = index === 0;
              upBtn.addEventListener('click', function () {
                moveStation(index, -1);
              });

              var downBtn = document.createElement('button');
              downBtn.type = 'button';
              downBtn.className = 'btn-move';
              downBtn.textContent = '▼';
              downBtn.setAttribute('aria-label', 'Bajar ' + name);
              downBtn.disabled = index === state.currentOrder.length - 1;
              downBtn.addEventListener('click', function () {
                moveStation(index, 1);
              });

              buttons.appendChild(upBtn);
              buttons.appendChild(downBtn);
              li.appendChild(buttons);
            }

            els.stationList.appendChild(li);
          });
        }

        function renderResult() {
          if (!state.gameOver) {
            els.result.hidden = true;
            return;
          }

          els.result.hidden = false;
          els.resultHeading.textContent = state.won ? '¡Lo lograste! 🎉' : 'Este era el orden correcto';

          els.guessGrid.innerHTML = '';
          state.history.forEach(function (attempt, i) {
            var row = document.createElement('div');
            row.className = 'guess-grid__row';

            var label = document.createElement('span');
            label.className = 'guess-grid__label';
            label.textContent = 'Intento ' + (i + 1);

            var squares = document.createElement('span');
            squares.className = 'guess-grid__squares';
            squares.setAttribute('aria-label', attempt.correctCount + ' de ' + STATIONS_PER_PUZZLE + ' en su lugar');

            attempt.guess.forEach(function (name, index) {
              var isCorrect = name === state.correctOrder[index];
              squares.appendChild(document.createTextNode(isCorrect ? '🟩' : '🟥'));
            });

            row.appendChild(label);
            row.appendChild(squares);
            els.guessGrid.appendChild(row);
          });

          els.revealCorrectOrder.innerHTML = '';
          state.correctOrder.forEach(function (name) {
            var li = document.createElement('li');
            li.textContent = name;
            els.revealCorrectOrder.appendChild(li);
          });
        }

        function buildShareText() {
          var grid = state.history.map(function (attempt) {
            return attempt.guess.map(function (name, index) {
              return name === state.correctOrder[index] ? '🟩' : '🟥';
            }).join('');
          }).join('\n');

          return 'Metrordle #' + state.gameNumber + '\n' + grid;
        }

        function copyViaExecCommand(text) {
          var textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();

          var succeeded = false;
          try {
            succeeded = document.execCommand('copy');
          } catch (e) {
            succeeded = false;
          }

          document.body.removeChild(textarea);

          return succeeded ? Promise.resolve() : Promise.reject(new Error('copy failed'));
        }

        function copyToClipboard(text) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text).catch(function () {
              return copyViaExecCommand(text);
            });
          }

          return copyViaExecCommand(text);
        }

        function shareResult() {
          var originalLabel = els.shareBtn.textContent;

          copyToClipboard(buildShareText()).then(function () {
            els.shareBtn.textContent = '¡Copiado!';
          }, function () {
            els.shareBtn.textContent = 'No se pudo copiar';
          }).then(function () {
            setTimeout(function () {
              els.shareBtn.textContent = originalLabel;
            }, 1500);
          });
        }

        function init() {
          els = {
            lineBadgeCircle: $('line-badge-circle'),
            lineBadgeName: $('line-badge-name'),
            hint: $('hint'),
            status: $('status'),
            stationList: $('station-list'),
            checkBtn: $('check-btn'),
            result: $('result'),
            resultHeading: $('result-heading'),
            guessGrid: $('guess-grid'),
            revealCorrectOrder: $('reveal-correct-order'),
            shareBtn: $('share-btn'),
          };

          els.checkBtn.addEventListener('click', checkOrder);
          els.shareBtn.addEventListener('click', shareResult);

          initGame();
        }

        document.addEventListener('DOMContentLoaded', init);
      })();
    </script>
  </body>
</html>
