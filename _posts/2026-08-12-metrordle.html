<!DOCTYPE html>
<html
  lang="es-MX"
>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="title" content="Metrordle se mudó">
    <meta name="description" content="Metrordle ahora vive en metrordle.com.">

    <title>Metrordle se mudó - eduardogarcia.xyz</title>

    <style>
      body {
        background-color: #0b0f14;
        color: #e7ecf2;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 1rem;
        text-align: center;
      }

      a {
        color: #0057a8;
      }
    </style>

    <script>
      (function () {
        'use strict';

        var count = 0;

        try {
          var raw = localStorage.getItem('metrordle:streak');
          var parsed = raw ? JSON.parse(raw) : null;

          if (parsed && typeof parsed.count === 'number' && parsed.count > 0) {
            count = parsed.count;
          }
        } catch (e) {
          // localStorage unavailable - redirect without a streak to carry.
        }

        var target = 'https://metrordle.com/' + (count > 0 ? '?carryStreakOver=' + count : '');

        window.location.replace(target);
      })();
    </script>
  </head>

  <body>
    <p>Metrordle se mudó a <a href="https://metrordle.com/">metrordle.com</a>. Redirigiendo…</p>
  </body>
</html>
