<!DOCTYPE html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="title" content="¿Latinoamérica, Iberoamérica o Hispanoamérica?">
    <meta name="description" content="Un mapa interactivo con las diferencias entre Latinoamérica, Iberoamérica, Hispanoamérica, Norteamérica, Centroamérica y Sudamérica.">

    <title>¿Latinoamérica, Iberoamérica o Hispanoamérica? - eduardogarcia.xyz</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --ink: #1d2730;
        --muted: #5b6b78;
        --paper: #ffffff;
        --ocean: #e8f1f7;
        --land: #cfd8df;
        --land-stroke: #ffffff;
        --chip: #f1f4f6;
        --rule: #dde3e8;

        --north: #1971c2;
        --central: #0b7285;
        --south: #6741d9;
        --latam: #c2255c;
        --hispano: #d9480f;
        --ibero: #8f6400;

        /* Set from JS to the selected category's color */
        --active: var(--north);

        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --ink: #e6edf3;
          --muted: #9aa8b4;
          --paper: #12181d;
          --ocean: #172129;
          --land: #34424d;
          --land-stroke: #12181d;
          --chip: #1f2a32;
          --rule: #2a3640;

          color-scheme: dark;
        }
      }

      :root[data-theme="dark"] {
        --ink: #e6edf3;
        --muted: #9aa8b4;
        --paper: #12181d;
        --ocean: #172129;
        --land: #34424d;
        --land-stroke: #12181d;
        --chip: #1f2a32;
        --rule: #2a3640;

        color-scheme: dark;
      }

      html {
        background-color: var(--paper);
        color: var(--ink);
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-size: 16px;
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        background-color: var(--paper);
      }

      .layout {
        display: grid;
        gap: 1rem;
        grid-template-areas:
          "header"
          "map"
          "controls"
          "details";
        margin: 0 auto;
        max-width: 1200px;
        padding: 1rem max(1rem, env(safe-area-inset-right)) 2rem max(1rem, env(safe-area-inset-left));
      }

      @media (min-width: 900px) {
        .layout {
          align-items: start;
          gap: 1.25rem 2rem;
          grid-template-areas:
            "map header"
            "map controls"
            "map details";
          grid-template-columns: minmax(0, 1fr) 26rem;
          grid-template-rows: auto auto 1fr;
          padding-top: 1.5rem;
        }
      }

      /* Header */

      .header {
        grid-area: header;
      }

      .header__title {
        font-size: clamp(1.5rem, 5vw, 2rem);
        letter-spacing: -.01em;
        line-height: 1.15;
        margin: 0 0 .5rem;
      }

      .header__intro {
        color: var(--muted);
        line-height: 1.45;
        margin: 0;
      }

      .header__language {
        color: var(--muted);
        display: inline-block;
        font-size: .875rem;
        margin-top: .5rem;
      }

      /* Category selectors */

      /* On phones the selectors stay at the bottom of the screen while the
         map is in view, within reach of a thumb */
      .controls {
        background-color: var(--paper);
        border-top: 1px solid var(--rule);
        bottom: 0;
        grid-area: controls;
        margin: 0 -1rem;
        padding: .6rem 1rem max(.6rem, env(safe-area-inset-bottom));
        position: sticky;
        z-index: 2;
      }

      @media (min-width: 900px) {
        .controls {
          border-top: 0;
          margin: 0;
          padding: 0;
          position: static;
        }
      }

      .controls__header {
        align-items: baseline;
        display: flex;
        justify-content: space-between;
      }

      .controls__group {
        display: grid;
        gap: .5rem;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .controls__label {
        color: var(--muted);
        font-size: .75rem;
        font-weight: bold;
        letter-spacing: .06em;
        margin: .5rem 0 .3rem;
        text-transform: uppercase;
      }

      .controls__header .controls__label {
        margin-top: 0;
      }

      .selector {
        --color: var(--north);

        align-items: center;
        background-color: var(--chip);
        border: 2px solid transparent;
        border-radius: .5rem;
        box-shadow: inset 0 -3px 0 var(--color);
        color: var(--ink);
        cursor: pointer;
        display: flex;
        font: inherit;
        font-size: clamp(.6875rem, 3.1vw, .875rem);
        font-weight: bold;
        justify-content: center;
        line-height: 1.2;
        min-height: 2.75rem;
        overflow: hidden;
        /* Last resort on very narrow screens */
        hyphens: auto;
        overflow-wrap: anywhere;
        padding: .4rem .2rem;
        position: relative;
        text-align: center;
        transition: background-color .2s, color .2s;
      }

      .selector:hover {
        border-color: var(--color);
      }

      .selector:focus-visible {
        outline: 3px solid var(--color);
        outline-offset: 2px;
      }

      .selector[aria-pressed="true"] {
        background-color: var(--color);
        color: #ffffff;
      }

      /* Time left until the next category while cycling */
      .selector__progress {
        background-color: rgba(255, 255, 255, .7);
        bottom: 0;
        height: 3px;
        left: 0;
        position: absolute;
        transform: scaleX(0);
        transform-origin: left;
        width: 100%;
      }

      .is-cycling .selector[aria-pressed="true"] .selector__progress {
        animation: progress var(--cycle-duration) linear forwards;
      }

      .is-paused .selector[aria-pressed="true"] .selector__progress {
        animation-play-state: paused;
      }

      .selector[data-category="north"] { --color: var(--north); }
      .selector[data-category="central"] { --color: var(--central); }
      .selector[data-category="south"] { --color: var(--south); }
      .selector[data-category="latam"] { --color: var(--latam); }
      .selector[data-category="hispano"] { --color: var(--hispano); }
      .selector[data-category="ibero"] { --color: var(--ibero); }

      .playback {
        align-items: center;
        background: none;
        border: 0;
        color: var(--muted);
        cursor: pointer;
        display: inline-flex;
        font: inherit;
        font-size: .875rem;
        gap: .35rem;
        padding: 0;
      }

      .playback:hover {
        color: var(--ink);
      }

      /* Map */

      .map-container {
        background-color: var(--ocean);
        border-radius: 1rem;
        grid-area: map;
        overflow: hidden;
        position: relative;
      }

      @media (min-width: 900px) {
        .map-container {
          position: sticky;
          top: 1.5rem;
        }
      }

      .map {
        display: block;
        height: auto;
        margin: 0 auto;
        max-height: calc(100vh - 3rem);
        max-height: calc(100dvh - 3rem);
        width: 100%;
      }

      .country {
        cursor: pointer;
        fill: var(--land);
        stroke: var(--land-stroke);
        stroke-linejoin: round;
        stroke-width: .6;
        transition: fill .45s ease;
      }

      .country--marker {
        stroke-width: 1.5;
      }

      .country.is-highlighted {
        fill: var(--active);
      }

      .country.is-focused {
        stroke: var(--ink);
        stroke-width: 2;
      }

      .country--marker.is-focused {
        stroke-width: 2.5;
      }

      /* Name and categories of the tapped or hovered country */
      .country-info {
        background-color: var(--paper);
        border-radius: .75rem;
        bottom: .75rem;
        box-shadow: 0 .25rem 1rem rgba(0, 0, 0, .15);
        left: .75rem;
        max-width: calc(100% - 1.5rem);
        padding: .6rem .8rem;
        pointer-events: none;
        position: absolute;
      }

      .country-info[hidden] {
        display: none;
      }

      .country-info__name {
        font-weight: bold;
        margin: 0 0 .25rem;
      }

      .country-info__categories {
        display: flex;
        flex-wrap: wrap;
        gap: .25rem .75rem;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .country-info__category {
        align-items: center;
        display: flex;
        font-size: .8125rem;
        gap: .3rem;
      }

      .country-info__category::before {
        background-color: var(--color);
        border-radius: 50%;
        content: '';
        height: .5rem;
        width: .5rem;
      }

      /* Selected category */

      .details {
        grid-area: details;
      }

      .details__kind {
        color: var(--active);
        font-size: .75rem;
        font-weight: bold;
        letter-spacing: .06em;
        margin: 0;
        text-transform: uppercase;
      }

      .details__name {
        font-size: 1.5rem;
        margin: .25rem 0 .5rem;
      }

      .details__definition {
        font-size: 1.0625rem;
        line-height: 1.45;
        margin: 0 0 .75rem;
      }

      .details__note {
        border-left: 3px solid var(--active);
        color: var(--muted);
        font-size: .9375rem;
        line-height: 1.45;
        margin: 0 0 1rem;
        padding-left: .75rem;
      }

      .details__count {
        font-size: .875rem;
        font-weight: bold;
        margin: 0 0 .5rem;
      }

      .details__countries {
        display: flex;
        flex-wrap: wrap;
        gap: .35rem;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .details__country {
        background-color: var(--chip);
        border-radius: 999px;
        cursor: default;
        font-size: .8125rem;
        padding: .25rem .6rem;
      }

      .details__country--territory {
        font-style: italic;
      }

      .details__legend {
        color: var(--muted);
        font-size: .8125rem;
        margin: .75rem 0 0;
      }

      .details__animated {
        animation: fade-in .35s ease;
      }

      @keyframes progress {
        to { transform: scaleX(1); }
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(.25rem); }
      }

      @media (prefers-reduced-motion: reduce) {
        .country {
          transition: none;
        }

        .details__animated {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="layout">
      <header class="header">
        <h1 class="header__title" data-i18n="title"></h1>
        <p class="header__intro" data-i18n="intro"></p>
        <a class="header__language" id="language-link"></a>
      </header>

      <nav class="controls" id="controls">
        <div class="controls__header">
          <p class="controls__label" data-i18n="geographic"></p>
          <button class="playback" id="playback" type="button"></button>
        </div>
        <div class="controls__group" id="geographic"></div>

        <p class="controls__label" data-i18n="cultural"></p>
        <div class="controls__group" id="cultural"></div>

      <div class="map-container" id="map-container">
        {% include americas-map.svg %}

        <div class="country-info" id="country-info" hidden>

          <ul class="details__countries" id="details-countries"></ul>
          <p class="details__legend" id="details-legend"></p>
        </div>
      </section>
    </div>

    <script>
      (function () {

        const $countries = Array.prototype.slice.call(document.querySelectorAll('.country'));
        const $countryInfo = document.getElementById('country-info');
        const $countryInfoName = document.getElementById('country-info-name');
        const $countryInfoCategories = document.getElementById('country-info-categories');
        const $detailsContent = document.getElementById('details-content');
        const $selectors = {};

        let selected = null;
        let cycling = false;
        let timer = null;
        let focusedCountry = null;

        function renderStaticText() {
          $root.lang = language === 'en' ? 'en-US' : 'es-MX';
          document.title = text.title + ' - eduardogarcia.xyz';

          document.querySelectorAll('[data-i18n]').forEach(function (element) {
            element.textContent = text[element.dataset.i18n];
          });

          document.getElementById('map-title').textContent = text.mapTitle;
          document.getElementById('details-legend').textContent = text.territoryLegend;

          const otherLanguageUrl = new URL(window.location.href);

          otherLanguageUrl.searchParams.set('lang', language === 'en' ? 'es-MX' : 'en-US');

          const $languageLink = document.getElementById('language-link');

          $languageLink.href = otherLanguageUrl.pathname + otherLanguageUrl.search;
          $languageLink.textContent = text.otherLanguage;
        }

        function renderSelectors() {
          CATEGORIES.forEach(function (category) {
            const button = document.createElement('button');
            const progress = document.createElement('span');

            button.className = 'selector';
            button.type = 'button';
            button.dataset.category = category.id;
            button.setAttribute('aria-pressed', 'false');
            button.appendChild(document.createTextNode(category[language].name));
            progress.className = 'selector__progress';
            button.appendChild(progress);

            button.addEventListener('click', function () {
              stopCycling();
              select(category.id);
            });

            document.getElementById(category.group).appendChild(button);
            $selectors[category.id] = button;
          });

          $controls.style.setProperty('--cycle-duration', CYCLE_DURATION_MS + 'ms');
          $playback.addEventListener('click', function () {
            if (cycling) {
              stopCycling();
            } else {
              startCycling(true);
            }
          });
        }

        function categoryById(id) {
          return CATEGORIES.find(function (category) {
            return category.id === id;
          });
        }

        function byName(a, b) {
          return COUNTRIES[a][language].localeCompare(COUNTRIES[b][language], language);
        }

        function select(id) {
          const category = categoryById(id);

          selected = id;
          $root.style.setProperty('--active', 'var(--' + id + ')');

          Object.keys($selectors).forEach(function (key) {
            $selectors[key].setAttribute('aria-pressed', key === id ? 'true' : 'false');
          });

          $countries.forEach(function (element) {
            element.classList.toggle('is-highlighted', category.countries.indexOf(element.dataset.country) !== -1);
          });

          renderDetails(category);
          updateUrl();
        }

        function renderDetails(category) {
          const copy = category[language];
          const territories = category.countries.filter(function (code) {
            return COUNTRIES[code].territory;
          }).length;
          const $list = document.getElementById('details-countries');

          document.getElementById('details-kind').textContent = copy.kind;
          document.getElementById('details-name').textContent = copy.name;
          document.getElementById('details-definition').textContent = copy.definition;
          document.getElementById('details-note').textContent = copy.note;
          document.getElementById('details-count').textContent = text.countries(category.countries.length - territories, territories);

          $list.replaceChildren();

          category.countries.slice().sort(byName).forEach(function (code) {
            const item = document.createElement('li');

            item.className = 'details__country' + (COUNTRIES[code].territory ? ' details__country--territory' : '');
            item.dataset.country = code;
            item.textContent = COUNTRIES[code][language];
            $list.appendChild(item);
          });

          document.getElementById('details-legend').hidden = territories === 0;

          // Restart the fade in
          $detailsContent.classList.remove('details__animated');
          void $detailsContent.offsetWidth;
          $detailsContent.classList.add('details__animated');
        }

        // Keeps the selected category in the URL so it can be shared, but only
        // once someone picked one: the cycling default stays a clean URL
        function updateUrl() {
          const nextUrl = new URL(window.location.href);

          if (cycling) {
            nextUrl.searchParams.delete('category');
          } else {
            nextUrl.searchParams.set('category', selected);
          }

          window.history.replaceState(null, '', nextUrl.pathname + nextUrl.search);
        }

        function next() {
          const index = CATEGORIES.findIndex(function (category) {
            return category.id === selected;
          });

          select(CATEGORIES[(index + 1) % CATEGORIES.length].id);
          restartProgress();
        }

        function schedule() {
          window.clearInterval(timer);
          timer = window.setInterval(next, CYCLE_DURATION_MS);
        }

        function restartProgress() {
          const $progress = $selectors[selected].querySelector('.selector__progress');

          $progress.style.animation = 'none';
          void $progress.offsetWidth;
          $progress.style.animation = '';
        }

        function startCycling(advance) {
          cycling = true;
          $controls.classList.add('is-cycling');
          $playback.textContent = text.pause;

          if (advance) {
            next();
          } else {
            restartProgress();
          }

          updateUrl();
          schedule();
        }

        function stopCycling() {
          cycling = false;
          window.clearInterval(timer);
          $controls.classList.remove('is-cycling');
          $playback.textContent = text.play;
          updateUrl();
        }

        // No point in cycling while nobody's looking; start over from the
        // current category when the tab is visible again
        function onVisibilityChange() {
          if (!cycling) {
            return;
          }

          if (document.hidden) {
            window.clearInterval(timer);
          } else {
            restartProgress();
            schedule();
          }
        }

        function focusCountry(code) {
          if (focusedCountry === code) {
            return;
          }

          focusedCountry = code;

          $countries.forEach(function (element) {
            element.classList.toggle('is-focused', element.dataset.country === code);
          });

          if (!code) {
            $countryInfo.hidden = true;
            return;
          }

          $countryInfoName.textContent = COUNTRIES[code][language];
          $countryInfoCategories.replaceChildren();

          CATEGORIES.filter(function (category) {
            return category.countries.indexOf(code) !== -1;
          }).forEach(function (category) {
            const item = document.createElement('li');

            item.className = 'country-info__category';
            item.style.setProperty('--color', 'var(--' + category.id + ')');
            item.textContent = category[language].name;
            $countryInfoCategories.appendChild(item);
          });

          $countryInfo.hidden = false;
        }

        function initCountryInfo() {
          // Mouse: follows the pointer. Touch: a tap shows a country until
          // something else is tapped
          $mapContainer.addEventListener('pointerover', function (event) {
            if (event.pointerType === 'mouse') {
              focusCountry(event.target.dataset.country || null);
            }
          });

          $mapContainer.addEventListener('pointerleave', function (event) {
            if (event.pointerType === 'mouse') {
              focusCountry(null);
            }
          });

          $mapContainer.addEventListener('click', function (event) {
            focusCountry(event.target.dataset.country || null);
          });

          // Hovering a name in the list points out the country on the map
          document.getElementById('details-countries').addEventListener('pointerover', function (event) {
            if (event.target.dataset.country) {
              focusCountry(event.target.dataset.country);
            }
          });

          document.getElementById('details-countries').addEventListener('pointerleave', function () {
            focusCountry(null);
          });
        }

        renderStaticText();
        renderSelectors();
        initCountryInfo();
        document.addEventListener('visibilitychange', onVisibilityChange);

        const initialCategory = categoryById(url.searchParams.get('category'));

        if (initialCategory) {
          select(initialCategory.id);
          stopCycling();
        } else {
          select(CATEGORIES[0].id);
          startCycling(false);
        }
      })();
    </script>
  </body>
</html>
